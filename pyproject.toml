[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-pi"
version = "0.5.0"
description = "Native LangChain chat models for OpenAI Codex subscription OAuth and OpenCode Zen/Go — no Node sidecar."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "cgaravitoq" }]
keywords = ["langchain", "langgraph", "openai", "codex", "opencode", "llm", "chat-model"]
dependencies = ["langchain-core>=0.3.15,<2", "langchain-openai>=0.2", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/cgaravitoq/langchain-pi"
Repository = "https://github.com/cgaravitoq/langchain-pi"

[project.scripts]
codex-login = "langchain_pi.cli:main"

[project.optional-dependencies]
test = [
  "langchain-tests>=0.3.5",
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "pytest-socket>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["langchain_pi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "T201"]
