[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-pi"
version = "0.4.0"
description = "LangChain BaseChatModel adapter for Pi (@earendil-works/pi-ai) via a Node sidecar — use Pi with any provider, model and auth from LangChain/LangGraph in Python. Includes a native opencode/Zen chat model (no pi)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "cgaravitoq" }]
keywords = ["langchain", "langgraph", "pi", "pi-ai", "llm", "chat-model"]
dependencies = ["langchain-core>=0.3.15,<2", "langchain-openai>=0.2"]

[project.urls]
Homepage = "https://github.com/cgaravitoq/langchain-pi"
Repository = "https://github.com/cgaravitoq/langchain-pi"

[project.optional-dependencies]
test = [
  "langchain-tests>=0.3.5",
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "pytest-socket>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["langchain_pi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "T201"]
